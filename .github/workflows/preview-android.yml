name: Preview Android candidate

on:
  push:
    branches: [feature/custom-reactions]
  pull_request:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Positive preview version code; empty uses this workflow run number'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: preview-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.6'
          fvm-version: '4.1.2'
      - name: Supply non-secret build placeholder
        run: echo 'KLIPY_API_KEY=' > .env
      - name: Ensure pinned artifact verification tools
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          fi
          for tool in aapt apksigner zipalign; do
            test -x "$ANDROID_HOME/build-tools/36.0.0/$tool"
          done
      - name: Test reaction behavior and artifact verifier
        run: |
          fvm flutter test --no-pub test/custom_reactions_test.dart
          python3 -m unittest discover -s scripts/tests -p 'test_preview_artifact.py'
      - name: Confirm normal preview releases require a signing key
        env:
          ORG_GRADLE_PROJECT_divyUnsignedCandidate: 'false'
        run: |
          test ! -e android/key.properties
          mkdir -p build
          if fvm flutter build apk --release --flavor divy --target-platform android-arm64 --no-pub --build-number 1 > build/preview-signing-check.log 2>&1; then
            echo 'Normal preview release unexpectedly accepted a missing signing key'
            exit 1
          fi
          if ! grep -F 'Preview release requires a complete release signing key' build/preview-signing-check.log; then
            cat build/preview-signing-check.log
            exit 1
          fi
      - name: Compile unsigned ARM64 release candidate
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          ORG_GRADLE_PROJECT_divyUnsignedCandidate: 'true'
        run: |
          candidate_number="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          [[ "$candidate_number" =~ ^[1-9][0-9]*$ ]] && (( candidate_number <= 2100000000 ))
          echo "PREVIEW_BUILD_NUMBER=$candidate_number" >> "$GITHUB_ENV"
          fvm flutter build apk --release --flavor divy --target-platform android-arm64 --no-pub --build-number "$candidate_number"
      - name: Verify candidate identity and write provenance
        env:
          BUILD_TOOLS_VERSION: '36.0.0'
        run: |
          python3 scripts/prepare_preview_artifact.py \
            --apk build/app/outputs/flutter-apk/app-divy-release.apk \
            --tools-dir "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            --version-code "$PREVIEW_BUILD_NUMBER" \
            --output-dir build/preview-candidate
      # This artifact needs the owner's release signature before installation.
      - name: Upload unsigned candidate for local signing
        if: github.repository == 'MishDivy/bluebubbles-app' && github.ref == 'refs/heads/feature/custom-reactions' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: divy-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: build/preview-candidate/
          if-no-files-found: error
          retention-days: 7
