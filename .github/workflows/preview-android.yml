name: Preview Android compile

on:
  push:
    branches: [feature/custom-reactions]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.44.6'
          fvm-version: '4.1.2'
      - name: Supply non-secret build placeholder
        run: echo 'KLIPY_API_KEY=' > .env
      # Compile verification only. Never distribute this debug-signed APK as a release.
      # No signing secrets, release uploads, or phone installation occur in this job.
      - name: Compile isolated preview package
        run: fvm flutter build apk --debug --flavor divy --target-platform android-arm64 --no-pub
